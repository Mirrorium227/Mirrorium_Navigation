<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>橙猫猫首页</title>
    <style>
        @font-face {
            font-family: 'LXGWNeoXiHeiPlus';
            src: url('LXGWNeoXiHeiPlus.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'LXGWNeoXiHeiPlus';
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            color: white;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .projects-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 30px;
            margin-top: 40px;
        }

        /* 横屏设备：一行最多两个 */
        @media (min-width: 768px) and (orientation: landscape) {
            .projects-grid {
                grid-template-columns: repeat(2, 1fr);
                max-width: 800px;
                margin: 40px auto 0;
            }
        }

        /* 大屏幕设备：保持两个一行的布局 */
        @media (min-width: 1024px) {
            .projects-grid {
                grid-template-columns: repeat(2, 1fr);
                max-width: 900px;
                margin: 40px auto 0;
            }
        }

        /* 超宽屏幕：仍然保持两个一行的布局，但增加最大宽度 */
        @media (min-width: 1400px) {
            .projects-grid {
                max-width: 1000px;
            }
        }

        .project-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .project-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

            .project-bg {
                width: 100%;
                aspect-ratio: 16/9;
                background-size: cover;
                background-repeat: no-repeat;
                background-position: center;
                position: relative;
            opacity: 0.7;
        }

        .project-bg.no-image {
            background: linear-gradient(45deg, #f0f0f0, #e0e0e0);
            opacity: 0.5;
        }

        .project-bg.no-image::after {
            content: '📁';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3rem;
            opacity: 0.5;
        }

        .project-info {
            padding: 20px;
            position: relative;
            z-index: 2;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .project-name {
            font-size: 1.3rem;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }

        .project-description {
            color: #666;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .project-info.blog-style {
            background: linear-gradient(135deg, #ffd89b, #ffb347);
            border-radius: 0 0 20px 20px;
        }

        .project-info.blog-style .project-name {
            color: #8b4513;
            font-weight: bold;
        }

        .project-info.blog-style .project-description {
            color: #a0522d;
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 1.2rem;
            margin: 50px 0;
        }

        .spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top: 4px solid white;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .no-projects {
            text-align: center;
            color: white;
            font-size: 1.2rem;
            margin: 50px 0;
        }

        .footer {
            text-align: center;
            margin-top: 60px;
            color: rgba(255,255,255,0.8);
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }
            
            .projects-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            
            .project-card {
                min-height: 180px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>橙猫猫导航中心</h1>
            <p>欢迎来到橙猫猫的个人导航页面</p>
        </div>

        <div id="projects-container" class="projects-grid">

        <div class="project-card" onclick="openProject('https://blog.mirrorium.top')">
            <div class="project-bg" style="background-image: url('橙猫猫博客预览页.jpg')">
            </div>
            <div class="project-info blog-style">
                <div class="project-name">橙猫猫博客预览页</div>
                <div class="project-description">这是一个关于编程技术和生活感悟的个人博客，记录我的学习成长历程</div>
            </div>
        </div>
        

        <div class="project-card" onclick="openProject('https://fhxc.mirrorium.top')">
            <div class="project-bg" style="background-image: url('方湖信创工作室.png')">
            </div>
            <div class="project-info">
                <div class="project-name">方湖信创工作室</div>
                <div class="project-description">我的工作室官网，展示各种创意作品和技术项目</div>
            </div>
        </div>
        

        <div class="project-card" onclick="openProject('https://fhxc.mirrorium.top')">
            <div class="project-bg" style="background-image: url('方湖信创工作室 copy.png')">
            </div>
            <div class="project-info">
                <div class="project-name">方湖信创工作室 copy</div>
                <div class="project-description">我的工作室官网，展示各种创意作品和技术项目</div>
            </div>
        </div>
        
        </div>
            <div class="project-info blog-style">
                <div class="project-name">橙猫猫博客预览页</div>
                <div class="project-description">这是一个关于编程技术和生活感悟的个人博客，记录我的学习成长历程</div>
            </div>
        </div>
        

        <div class="project-card" onclick="openProject('https://fhxc.mirrorium.top')">
            <div class="project-bg" style="background-image: url('方湖信创工作室.png')">
            </div>
            <div class="project-info">
                <div class="project-name">方湖信创工作室</div>
                <div class="project-description">我的工作室官网，展示各种创意作品和技术项目</div>
            </div>
        </div>
        
        </div>

        <div class="footer">
            <p>© 2024 Mirrorium. 所有权利保留。</p>
        </div>
    </div>

    <script>
        // 打开项目
        function openProject(url) {
            if (url && url !== '#') {
                window.open(url, '_blank');
            }
        }

        // 添加一些交互效果
        document.addEventListener('DOMContentLoaded', () => {
            // 为项目卡片添加点击动画
            document.addEventListener('click', (e) => {
                if (e.target.closest('.project-card')) {
                    e.target.closest('.project-card').style.transform = 'scale(0.95)';
                    setTimeout(() => {
                        e.target.closest('.project-card').style.transform = '';
                    }, 150);
                }
            });
        });
    </script>
</body>
</html>
